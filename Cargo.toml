[workspace]
resolver = "2"
members = ["chat-client", "chat-core", "chat-server"]
default-members = ["chat-client", "chat-core", "chat-server"]
exclude = ["developer-tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
bincode = "2"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
dashmap = "6"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
clap = "4"
tracing-subscriber = "0.3"
bytes = "1"
crossbeam = "0.8"
parking_lot = "0.12"

# Testing and benchmarking
criterion = "0.5"
tokio-test = "0.4"

# Release profile - Maximum performance
[profile.release]
lto = "fat"       # Full LTO across all crates
panic = 'abort'   # Abort on panic (smaller, faster)
codegen-units = 1 # Single unit for best optimization
